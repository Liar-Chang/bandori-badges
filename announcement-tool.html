<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>公告產生器 — BanG Dream! 徽章圖鑑</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0f0f13;--surface:#1a1a22;--surface2:#22222e;--border:#2e2e3e;
  --accent:#ff6eb4;--accent2:#c084fc;--text:#f0f0f0;--muted:#888;
  --green:#22c55e;--yellow:#f5c800;
}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:1.5rem;}
h1{font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-family:'Space Mono',monospace;margin-bottom:0.25rem;}
.subtitle{font-size:0.72rem;color:var(--muted);margin-bottom:1.75rem;}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;max-width:1100px;margin:0 auto;}
@media(max-width:768px){.layout{grid-template-columns:1fr;}}
.panel{background:var(--surface);border-radius:12px;padding:1.25rem;border:1px solid var(--border);}
.panel h2{font-size:0.65rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem;}
.field{margin-bottom:0.85rem;}
.field label{font-size:0.72rem;color:var(--muted);display:block;margin-bottom:0.3rem;}
.field input,.field textarea{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-family:'Noto Sans TC',sans-serif;font-size:0.83rem;padding:0.5rem 0.7rem;outline:none;transition:border 0.15s;resize:vertical;}
.field input:focus,.field textarea:focus{border-color:var(--accent2);}
.field textarea{min-height:90px;line-height:1.6;}
.btn{font-family:'Noto Sans TC',sans-serif;font-size:0.78rem;font-weight:700;padding:0.55rem 1.1rem;border-radius:8px;border:none;cursor:pointer;transition:all 0.15s;display:inline-flex;align-items:center;gap:0.35rem;}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}
.btn-primary:hover{opacity:0.85;}
.btn-copy{background:var(--surface2);color:var(--muted);border:1.5px solid var(--border);font-size:0.72rem;padding:0.35rem 0.8rem;}
.btn-copy:hover{border-color:var(--accent2);color:var(--accent2);}
.btn-copy.copied{border-color:var(--green);color:var(--green);}
.output-block{margin-bottom:1rem;}
.output-block-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.4rem;}
.output-label{font-size:0.65rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);}
.char-count{font-size:0.65rem;color:var(--muted);font-family:'Space Mono',monospace;}
.char-count.warn{color:var(--yellow);}
.char-count.over{color:#e05c5c;}
.output-text{background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:0.7rem 0.85rem;font-size:0.8rem;line-height:1.8;white-space:pre-wrap;word-break:break-all;min-height:80px;color:var(--text);}
textarea.output-text{font-family:'Noto Sans TC',sans-serif;width:100%;resize:vertical;outline:none;display:block;}
textarea.output-text:focus{border-color:var(--accent2);}
textarea.output-text:read-only{cursor:text;}
.generate-row{display:flex;gap:0.5rem;margin-bottom:1.25rem;flex-wrap:wrap;}
.divider{height:1px;background:var(--border);margin:1rem 0;}
.hashtag-hint{font-size:0.67rem;color:var(--muted);margin-top:0.25rem;line-height:1.5;}
</style>
</head>
<body>

<div style="max-width:1100px;margin:0 auto;">
  <h1>📢 ANNOUNCEMENT GENERATOR</h1>
  <div class="subtitle">BanG Dream! 徽章圖鑑 — 公告產生器</div>

  <div class="layout">

    <!-- 左側：輸入 -->
    <div class="panel">
      <h2>輸入內容</h2>

      <div class="field">
        <label>日期</label>
        <input type="text" id="in-date" placeholder="如 2026/4/16"/>
      </div>

      <div class="field">
        <label>【新增】（繁中，空白則略過此標題）</label>
        <textarea id="in-new-add" placeholder="如：&#10;・Afterglow 3rd Single「ツナグ、ソラモヨウ」(新增 1 張)"></textarea>
      </div>

      <div class="field">
        <label>【更新資料】（繁中，空白則略過此標題）</label>
        <textarea id="in-new-update" placeholder="如：&#10;・修正 #2745 的活動簡稱"></textarea>
      </div>

      <div class="field">
        <label>【更新圖檔】（繁中，空白則略過此標題）</label>
        <textarea id="in-new-image" placeholder="如：&#10;・#2740 換更清晰的圖"></textarea>
      </div>

      <div class="field">
        <label>【功能調整】（繁中，空白則顯示「（無）」）</label>
        <textarea id="in-func" placeholder="如：&#10;・篩選樂團時角色清單不再顯示其他團的單人成員"></textarea>
      </div>

      <div class="divider"></div>

      <div class="field">
        <label>X 第一則日文內容（新增資料，貼上我幫你翻的）</label>
        <textarea id="in-x1-ja" placeholder="如：&#10;新規缶バッジ追加！&#10;・BanG Dream! 缶バッジセット..."></textarea>
      </div>

      <div class="field">
        <label>X 第二則日文內容（功能調整，貼上我幫你翻的）</label>
        <textarea id="in-x2-ja" placeholder="如：&#10;・バンド絞り込み時、他バンドの単体メンバーが..."></textarea>
      </div>

      <div class="field">
        <label>X 第一則韓文內容（新增資料，貼上我幫你翻的）</label>
        <textarea id="in-x1-ko" placeholder="如：&#10;새 캔뱃지 추가！&#10;・..."></textarea>
      </div>

      <div class="field">
        <label>X 第二則韓文內容（功能調整，貼上我幫你翻的）</label>
        <textarea id="in-x2-ko" placeholder="如：&#10;・밴드 필터링 시..."></textarea>
      </div>

      <div class="field">
        <label>X 額外 Hashtag（對應樂團/角色，日韓共用）</label>
        <input type="text" id="in-hashtag" placeholder="如 #MyGO #千早愛音"/>
        <div class="hashtag-hint">日文固定：#バンドリ #BanGDream #缶バッジ図鑑<br>韓文固定：#뱅드림 #BanGDream #뱃지도감</div>
      </div>

      <div class="generate-row">
        <button class="btn btn-primary" onclick="generate()">✨ 產生公告</button>
      </div>
    </div>

    <!-- 右側：輸出 -->
    <div class="panel">
      <h2>輸出結果</h2>

      <div class="output-block">
        <div class="output-block-header">
          <span class="output-label">🧵 Threads 版</span>
          <div style="display:flex;align-items:center;gap:0.5rem;">
            <span class="char-count" id="threads-count">—</span>
            <button class="btn btn-copy" onclick="copyText('threads-out', this)">複製</button>
          </div>
        </div>
        <textarea class="output-text" id="threads-out" readonly rows="6">產生後顯示於此</textarea>
      </div>

      <div class="divider"></div>

      <div class="lang-section" style="margin-bottom:0.85rem;">
        <h3 style="font-size:0.7rem;color:var(--accent2);margin-bottom:0.5rem;letter-spacing:0.1em;text-transform:uppercase;">🇯🇵 日文 𝕏</h3>
        <div id="x1ja-container"><div class="output-block" style="opacity:0.5;"><div class="output-text" style="font-size:0.78rem;color:var(--muted);min-height:auto;padding:0.5rem 0.85rem;">第一則（新增資料）— 產生後顯示於此</div></div></div>
        <div id="x2ja-container" style="margin-top:0.6rem;"><div class="output-block" style="opacity:0.5;"><div class="output-text" style="font-size:0.78rem;color:var(--muted);min-height:auto;padding:0.5rem 0.85rem;">第二則（機能調整）— 產生後顯示於此</div></div></div>
      </div>

      <div class="divider"></div>

      <div class="lang-section">
        <h3 style="font-size:0.7rem;color:var(--accent2);margin-bottom:0.5rem;letter-spacing:0.1em;text-transform:uppercase;">🇰🇷 韓文 𝕏</h3>
        <div id="x1ko-container"><div class="output-block" style="opacity:0.5;"><div class="output-text" style="font-size:0.78rem;color:var(--muted);min-height:auto;padding:0.5rem 0.85rem;">第一則（추가 데이터）— 產生後顯示於此</div></div></div>
        <div id="x2ko-container" style="margin-top:0.6rem;"><div class="output-block" style="opacity:0.5;"><div class="output-text" style="font-size:0.78rem;color:var(--muted);min-height:auto;padding:0.5rem 0.85rem;">第二則（기능 조정）— 產生後顯示於此</div></div></div>
      </div>
    </div>

  </div>
</div>

<script>
const SITE_URL = 'https://liar-chang.github.io/bandori-badges/';
const JA_FIXED_HASHTAGS = '#バンドリ #BanGDream #缶バッジ図鑑';
const KO_FIXED_HASHTAGS = '#뱅드림 #BanGDream #뱃지도감';
const JA_TITLE = '【図鑑更新✨】';
const KO_TITLE = '【도감 업데이트✨】';
const JA_FUNC = '【機能調整】';
const KO_FUNC = '【기능 조정】';
const JA_NONE = '(なし)';
const KO_NONE = '(없음)';
const X_LIMIT = 280;

// 自動分格:把超過 X 字數上限的內容切成多則 post
// - preamble:只放第一則的開頭(URL + 標題)
// - content:主要內容,按 \n 切行 greedy pack
// - postamble:只放第一則的結尾(hashtags) — 計入第一則字數
// - prefixReserve:預留給 "(N/M)" 標記的字數(8 字就夠 `\n(10/10)`)
function splitForX({preamble = '', content = '', postamble = '', limit = X_LIMIT, prefixReserve = 8}){
  // 先試試是否能塞進單一 post
  const single = (preamble ? preamble + '\n' : '') + content + (postamble ? '\n\n' + postamble : '');
  if(countX(single) <= limit) return [single];

  // 需要分格,按行切 content (typically 每行 = 1 條 ・bullet)
  const lines = content.split('\n');
  const preambleLen = preamble ? countX(preamble) + 1 : 0;       // +1 for \n
  const postambleLen = postamble ? 2 + countX(postamble) : 0;    // +2 for \n\n
  const firstBudget = limit - preambleLen - postambleLen - prefixReserve;
  const restBudget = limit - prefixReserve;

  const chunks = [];
  let curLines = [];
  let curLen = 0;
  let isFirst = true;

  function flushChunk(){
    if(curLines.length > 0){
      chunks.push(curLines.join('\n'));
      curLines = [];
      curLen = 0;
      isFirst = false;
    }
  }

  for(const line of lines){
    const lineLen = countX(line);
    const wouldBeLen = curLines.length === 0 ? lineLen : curLen + 1 + lineLen;
    const budget = isFirst ? firstBudget : restBudget;

    if(wouldBeLen > budget){
      flushChunk();
      curLines = [line];
      curLen = lineLen;
    } else {
      curLines.push(line);
      curLen = wouldBeLen;
    }
  }
  flushChunk();

  // 組裝最終 posts:每則加上 (N/M);第一則前置 preamble,結尾加 postamble
  const total = chunks.length;
  return chunks.map((chunk, i) => {
    const numSuffix = total > 1 ? `\n(${i+1}/${total})` : '';
    if(i === 0){
      let post = preamble ? preamble + '\n' : '';
      post += chunk + numSuffix;
      if(postamble) post += '\n\n' + postamble;
      return post;
    }
    return chunk + numSuffix;
  });
}

// 動態渲染多則 post 到指定容器
function renderXPosts(containerId, posts, labelPrefix){
  const container = document.getElementById(containerId);
  if(!container) return;
  container.innerHTML = posts.map((post, i) => {
    const subLabel = posts.length > 1 ? ` (${i+1}/${posts.length})` : '';
    const safeId = `${containerId}-${i}`;
    const rows = Math.min(8, Math.max(4, post.split('\n').length));
    const overLimit = countX(post) > X_LIMIT;
    return `
      <div class="output-block" style="margin-top:${i > 0 ? '0.6rem' : '0'};">
        <div class="output-block-header">
          <span class="output-label">${labelPrefix}${subLabel}${overLimit ? ' ⚠️ 超字' : ''}</span>
          <div style="display:flex;align-items:center;gap:0.5rem;">
            <span class="char-count" id="${safeId}-count">—</span>
            <button class="btn btn-copy" onclick="copyText('${safeId}', this)">複製</button>
          </div>
        </div>
        <textarea class="output-text" id="${safeId}" readonly rows="${rows}"></textarea>
      </div>
    `;
  }).join('');
  // 用 .value 設值(避開 HTML escape 問題)+ 更新字數
  posts.forEach((post, i) => {
    const safeId = `${containerId}-${i}`;
    const ta = document.getElementById(safeId);
    if(ta) ta.value = post;
    updateCount(`${safeId}-count`, post, X_LIMIT, true);
  });
}

function generate(){
  const date = document.getElementById('in-date').value.trim();
  const addData = document.getElementById('in-new-add').value.trim();
  const updateData = document.getElementById('in-new-update').value.trim();
  const imageData = document.getElementById('in-new-image').value.trim();
  const funcData = document.getElementById('in-func').value.trim();
  const x1ja = document.getElementById('in-x1-ja').value.trim();
  const x2ja = document.getElementById('in-x2-ja').value.trim();
  const x1ko = document.getElementById('in-x1-ko').value.trim();
  const x2ko = document.getElementById('in-x2-ko').value.trim();
  const extraHashtag = document.getElementById('in-hashtag').value.trim();

  // ── Threads 版(繁中)──
  let newSection;
  if(!addData && !updateData && !imageData){
    newSection = '【新增/更新資料】\n(無)';
  } else {
    const parts = [];
    if(addData)    parts.push(`【新增】\n${addData}`);
    if(updateData) parts.push(`【更新資料】\n${updateData}`);
    if(imageData)  parts.push(`【更新圖檔】\n${imageData}`);
    newSection = parts.join('\n\n');
  }
  const funcSection = funcData || '(無)';
  const threads = `${date}網頁更新\n\n${SITE_URL}\n\n${newSection}\n\n【功能調整】\n${funcSection}`;
  document.getElementById('threads-out').value = threads;
  updateCount('threads-count', threads, 500, false);

  // ── 日文 𝕏 ──
  const jaHashtags = [JA_FIXED_HASHTAGS, extraHashtag].filter(Boolean).join(' ');
  // 第一則:URL + 標題 + 內容 + hashtags(第一則的字數含 hashtags)
  const x1jaPosts = splitForX({
    preamble: `${SITE_URL}\n${JA_TITLE}`,
    content: x1ja || JA_NONE,
    postamble: jaHashtags
  });
  renderXPosts('x1ja-container', x1jaPosts, '𝕏 JP 第一則（新增資料）');
  // 第二則:機能調整(無 URL / hashtags)
  const x2jaPosts = splitForX({
    content: `${JA_FUNC}\n${x2ja || JA_NONE}`
  });
  renderXPosts('x2ja-container', x2jaPosts, '𝕏 JP 第二則（機能調整）');

  // ── 韓文 𝕏 ──
  const koHashtags = [KO_FIXED_HASHTAGS, extraHashtag].filter(Boolean).join(' ');
  const x1koPosts = splitForX({
    preamble: `${SITE_URL}\n${KO_TITLE}`,
    content: x1ko || KO_NONE,
    postamble: koHashtags
  });
  renderXPosts('x1ko-container', x1koPosts, '𝕏 KO 第一則（추가 데이터）');
  const x2koPosts = splitForX({
    content: `${KO_FUNC}\n${x2ko || KO_NONE}`
  });
  renderXPosts('x2ko-container', x2koPosts, '𝕏 KO 第二則（기능 조정）');
}

// X(Twitter)字數計算
// - 半形字元 = 1
// - 全形字元(CJK) = 2
// - URL 固定 23 字(X 會自動短縮)
function countX(text){
  // 先把 URL 替換成佔位符,計為 23
  const urlRegex = /https?:\/\/[^\s]+/g;
  const urls = text.match(urlRegex) || [];
  let stripped = text.replace(urlRegex, '');
  let count = urls.length * 23;

  // 計算剩餘文字
  for(const ch of stripped){
    const code = ch.codePointAt(0);
    // 半形 ASCII (0x00-0x7F) 算 1
    // 半形片假名 (0xFF61-0xFF9F) 算 1
    if(code <= 0x7F || (code >= 0xFF61 && code <= 0xFF9F)){
      count += 1;
    } else {
      count += 2;
    }
  }
  return count;
}

function updateCount(elId, text, limit, isX){
  const el = document.getElementById(elId);
  const len = isX ? countX(text) : [...text].length;
  el.textContent = `${len} / ${limit}`;
  el.className = 'char-count' + (len > limit ? ' over' : len > limit * 0.85 ? ' warn' : '');
}

function copyText(elId, btn){
  const text = document.getElementById(elId).value;
  if(text === '產生後顯示於此' || !text) return;
  navigator.clipboard.writeText(text).then(()=>{
    const orig = btn.textContent;
    btn.textContent = '✓ 已複製';
    btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent=orig; btn.classList.remove('copied'); }, 2000);
  });
}
</script>
</body>
</html>
